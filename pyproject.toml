[project]
name = "red-herring"
version = "0.1.0"
description = "Open-set detection and conformal prediction for GC-MS fish species authentication"
readme = "README.md"
authors = [
    { name = "woodRock", email = "j.r.h.wood98@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "torch>=2.14.1",
]

[project.scripts]
red-herring = "red_herring:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "NPY", "PT"]
# Unicode ×, →, ±, – are intentional in docstrings and output tables.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=red_herring --cov-report=term-missing"
filterwarnings = ["ignore::UserWarning:sklearn"]

[tool.coverage.run]
branch = true
source = ["red_herring"]

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ['if __name__ == "__main__":']
